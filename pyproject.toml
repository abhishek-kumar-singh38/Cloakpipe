[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloakpipe"
version = "0.1.0"
description = "Educational binary transformation and detection research pipeline"
requires-python = ">=3.10"
dependencies = ["Jinja2>=3.1,<4"]

[project.scripts]
cloakpipe = "cloakpipe.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
